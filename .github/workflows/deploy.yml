name: CI/CD - Build & Deploy .NET 8 to Docker Swarm

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build .NET 8 Docker Image
        run: docker build -t my-dotnet-backend:${{ github.sha }} ./backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Registry
        run: |
          docker tag my-dotnet-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/dotnet-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dotnet-backend:latest

      - name: Rolling Update on Swarm Cluster
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: vagrant
          key: ${{ secrets.SWARM_SSH_KEY }}
          script: |
            docker service update --image ${{ secrets.DOCKERHUB_USERNAME }}/dotnet-backend:latest --force app_backend

