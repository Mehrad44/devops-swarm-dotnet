version: "3.8"

services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - /vagrant/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    deploy:
      placement:
        constraints: [node.role == manager]

  frontend:
    image: nginx:alpine
    volumes:
      - /vagrant/frontend:/usr/share/nginx/html:ro
    networks:
      - app-net
    deploy:
      replicas: 1

  backend:
    image: my-dotnet-backend:1.0
    environment:
      - DB_HOST=db
      - DB_NAME=appdb
      - DB_USER=postgres
      - DB_PASS=Secret123
    networks:
      - app-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Secret123
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net
    deploy:
      placement:
        constraints: [node.role == manager]

  monitoring:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - app-net
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  app-net:
    driver: overlay

volumes:
  db-data:
  portainer-data:
